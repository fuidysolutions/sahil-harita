<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgeGo</title>
<link rel="stylesheet" href="/assets/vendor/jakarta/fonts.css">
<style>
  /* S1 (Eki 2026): masaüstü sahnesi — uygulama 393×852 iPhone ekranında, iframe içinde birebir mobil çalışır */
  :root{--ink:#0B1F33;--ink-3:#6B7F93;--sea:#0A7FC2;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:radial-gradient(120% 90% at 50% 0%,#F6F9FB 0%,#E9F1F6 55%,#DDE9F1 100%);}
  .bg{position:fixed;inset:-8%;background:url(/assets/map/tex-2560.jpg) center/cover no-repeat;
    filter:blur(48px) saturate(1.1);opacity:.32;transform:scale(1.05);pointer-events:none;}
  .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(246,249,251,.55),rgba(233,241,246,.2) 50%,rgba(221,233,241,.6));}
  .stage{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;}
  .wrap{position:relative;}
  .phone{position:absolute;left:0;top:0;width:419px;height:878px;transform-origin:0 0;
    border-radius:68px;padding:13px;
    background:linear-gradient(150deg,#3a3b3f 0%,#1d1e21 38%,#0c0c0e 100%);
    box-shadow:0 0 0 1.5px #6c6d72,0 0 0 3px #1b1c1f,
      0 50px 90px rgba(11,31,51,.30),0 18px 36px rgba(11,31,51,.20);}
  .phone::before,.phone::after{content:'';position:absolute;width:4px;border-radius:2px;background:#2a2b2f;}
  .phone::before{left:-4px;top:176px;height:58px;box-shadow:0 78px 0 #2a2b2f;}   /* ses tuşları */
  .phone::after{right:-4px;top:240px;height:96px;}                                /* yan tuş */
  .screen{position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:#fff;
    isolation:isolate;}
  .screen iframe{position:absolute;inset:0;width:393px;height:852px;border:0;display:block;background:#fff;}
  .island{position:absolute;z-index:4;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;pointer-events:none;}
  .sbar{position:absolute;z-index:3;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;
    padding:4px 30px 0 46px;color:#fff;font:600 16px/1 -apple-system,'SF Pro Text','Plus Jakarta Sans',system-ui,sans-serif;
    letter-spacing:-.01em;text-shadow:0 1px 6px rgba(0,0,0,.35);pointer-events:none;}
  .sbar svg{display:block;fill:#fff;filter:drop-shadow(0 1px 4px rgba(0,0,0,.35));}
  .sbar .ic{display:flex;align-items:center;gap:6px;}
  .home{position:absolute;z-index:3;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;
    background:rgba(11,31,51,.82);pointer-events:none;}
  .qr{position:fixed;z-index:2;right:32px;bottom:28px;display:flex;align-items:center;gap:14px;
    padding:12px 18px 12px 12px;border-radius:20px;background:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 32px rgba(11,31,51,.10);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
  .qr img{width:72px;height:72px;display:block;padding:6px;background:#fff;border-radius:12px;}
  .qr b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;}
  .qr span{display:block;font-size:12px;font-weight:500;color:var(--ink-3);margin-top:3px;}
  @media (max-width:1100px),(max-height:620px){ .qr{display:none;} }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="stage">
  <div class="wrap" id="wrap">
    <div class="phone" id="phone">
      <div class="screen">
        <iframe id="app" title="AlgeGo" allow="clipboard-write; fullscreen; geolocation"></iframe>
        <div class="sbar" aria-hidden="true">
          <span>9:41</span>
          <span class="ic">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.3-1.4C13.3 1.6 10.8.6 8 .6S2.7 1.6.7 3.6L2 5c1.6-1.5 3.7-2.4 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.4C11.5 5 9.8 4.2 8 4.2S4.5 5 3.3 6.1l1.3 1.4c.9-.8 2.1-1.3 3.4-1.3zm0 3.6c-.5 0-1 .2-1.3.5L8 11.8l1.3-1.5c-.3-.3-.8-.5-1.3-.5z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="20" height="9" rx="2.2"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" fill-opacity=".5"/></svg>
          </span>
        </div>
        <div class="island" aria-hidden="true"></div>
        <div class="home" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</main>
<aside class="qr" aria-label="Telefonunda aç">
  <img src="/assets/brand/qr-site.svg" alt="">
  <div><b>Telefonunda aç</b><span>Kamerayla okut</span></div>
</aside>
<script>
(function(){
  var W=419, H=878;
  var u=new URLSearchParams(location.search).get('u')||'/';
  if(u.charAt(0)!=='/'||u.charAt(1)==='/') u='/';                     // yalnız aynı site içi yol
  var hash='', hi=u.indexOf('#'); if(hi>=0){ hash=u.slice(hi); u=u.slice(0,hi); }
  document.getElementById('app').src=u+(u.indexOf('?')>=0?'&':'?')+'frame=1'+hash;
  try{ history.replaceState(null,'',u+hash); }catch(e){}               // adres çubuğunda asıl yol kalsın
  var wrap=document.getElementById('wrap'), phone=document.getElementById('phone');
  function fit(){
    var s=Math.min(1,(innerHeight-48)/H,(innerWidth-48)/W);
    phone.style.transform='scale('+s+')';
    wrap.style.width=(W*s)+'px'; wrap.style.height=(H*s)+'px';
  }
  addEventListener('resize',fit); fit();
})();
</script>
</body>
</html>
